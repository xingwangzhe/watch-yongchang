name: Godot Verify

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asset-guard:
    name: Asset red lines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Verify generated project metadata
        run: |
          bun run tools/sync_project_env.ts --check
          bun test tools/sync_project_env.test.ts
          python3 tools/test_package_release.py

      - name: Retired unit paths and static.png must stay gone
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check_empty() {
            local label="$1"; shift
            local out
            out="$("$@" || true)"
            if [ -n "$out" ]; then
              echo "::error title=Asset red line: $label"
              echo "$out"
              fail=1
            fi
          }
          check_empty "static.png references" grep -R -n -E 'static\.png' game/scripts game/data game/scenes
          check_empty "retired unit directories" grep -R -n -E 'assets/units/(xiangyong|gongshou|longdeng|tengpai|huochong|jinshi|wokou_scout|wokou_gun|wokou_ronin|wokou_shield|wokou_chief)' game/scripts game/data game/scenes
          check_empty "legacy texture field in characters.json" grep -n '"texture"' game/data/characters.json
          check_empty "non-atlas unit directories" find game/assets/units -maxdepth 1 -mindepth 1 -type d ! -name full_sheets ! -name towers
          check_empty "legacy unit art at repo root" find assets -maxdepth 3 -type f \( -name '*.png' -o -name '预览-*.jpg' \)
          if [ "$fail" -ne 0 ]; then
            echo "Asset red line violated; see the project asset rules in game/README.md."
            exit 1
          fi
          echo "Asset red lines clean."

      - name: Tower art must be baked and registered
        shell: bash
        run: |
          set -euo pipefail
          for tier in watchtower arrow_tower dragon_tower; do
            test -f "game/assets/units/towers/${tier}.png" || { echo "missing tower sprite: $tier" >&2; exit 1; }
          done
          grep -q 'watchtower_pixel_art' game/data/credits.json
          grep -q 'watchtower_pixel_art' 素材授权清单.csv
          echo "Tower art registered."

      - name: Check Dora adapter statically
        shell: bash
        run: |
          set -euo pipefail
          python3 dora/build.py --check
          echo "Dora adapter static checks passed."

      - name: Verify tag matches game version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          GAME_VERSION="$(sed -n 's/^APP_VERSION=//p' .env | head -n1)"
          test -n "$GAME_VERSION"
          test "v${GAME_VERSION}" = "${GITHUB_REF_NAME}"
          echo "Tag ${GITHUB_REF_NAME} matches game version ${GAME_VERSION}."

  quality-guards:
    name: Formal, visual, and performance guards
    uses: ./.github/workflows/quality-guards.yml

  gut:
    name: GUT quality gate
    needs: [asset-guard, quality-guards]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/godot
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          if [ -z "$VERSION" ]; then
            echo "game/.godot-version is empty" >&2
            exit 1
          fi
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d .tools
          mv ".tools/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          echo "expected=${GODOT_VERSION} actual=${ACTUAL}"
          if [[ "$ACTUAL" != "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]; then
            echo "Godot binary does not match game/.godot-version" >&2
            exit 1
          fi

      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --path game --import

      - name: Run GUT
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/gut
          "$GODOT_BIN" --headless --path game -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -gexit \
            2>&1 | tee ci-artifacts/gut/gut.log

      - name: Upload GUT log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-log
          path: ci-artifacts/gut/gut.log
          if-no-files-found: warn
          retention-days: 14

  linux-platform:
    name: Linux platform smoke
    needs: gut
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/godot
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          if [ -z "$VERSION" ]; then
            echo "game/.godot-version is empty" >&2
            exit 1
          fi
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d .tools
          mv ".tools/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          echo "expected=${GODOT_VERSION} actual=${ACTUAL}"
          if [[ "$ACTUAL" != "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]; then
            echo "Godot binary does not match game/.godot-version" >&2
            exit 1
          fi

      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --path game --import

      - name: Smoke test Linux launcher
        run: |
          WATCH_RENDERER=opengl GDA_GODOT="$GODOT_BIN" \
            timeout 60 ./game/launch.sh --headless --quit-after 2

  windows-platform:
    name: Windows platform smoke (native)
    needs: gut
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        shell: pwsh
        run: |
          $version = (Get-Content game/.godot-version -Raw).Trim()
          if (-not $version) {
            throw "game/.godot-version is empty."
          }
          "GODOT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path .tools | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "godot-win64.zip"
          $url = "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)/Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          curl.exe -fL --retry 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Expand-Archive -Path $zip -DestinationPath .tools -Force
          $console = Get-ChildItem ".tools" -Filter "Godot_v*_win64_console.exe" | Select-Object -First 1
          if (-not $console) {
            throw "Godot Windows console executable was not found."
          }
          "GODOT_BIN=$($console.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $actual = (& $console.FullName --version | Out-String).Trim()
          $parts = $env:GODOT_VERSION -split "-", 2
          $expectedPrefix = "$($parts[0]).$($parts[1])."
          Write-Output "expected=$env:GODOT_VERSION actual=$actual"
          if (-not $actual.StartsWith($expectedPrefix)) {
            throw "Godot binary does not match game/.godot-version."
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Import project
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path game --import
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Smoke test Windows launcher
        shell: pwsh
        run: |
          $env:WATCH_GODOT = $env:GODOT_BIN
          $env:WATCH_RENDERER = "opengl"
          $env:WATCH_SETTINGS_PATH = Join-Path $env:RUNNER_TEMP "watch-yongchang-renderer.cfg"
          $output = cmd.exe /d /c "game\launch.bat --headless --quit-after 2" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          $joined = $output -join "`n"
          if ($joined -notmatch "\[launch\] renderer=opengl") {
            throw "Windows launcher did not select OpenGL."
          }

  macos-platform:
    name: macOS platform smoke (native)
    needs: gut
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/Godot.app/Contents/MacOS/Godot
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          if [ -z "$VERSION" ]; then
            echo "game/.godot-version is empty" >&2
            exit 1
          fi
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools
          chmod +x "$GODOT_BIN"
          xattr -dr com.apple.quarantine .tools/Godot.app || true
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          echo "expected=${GODOT_VERSION} actual=${ACTUAL}"
          if [[ "$ACTUAL" != "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]; then
            echo "Godot binary does not match game/.godot-version" >&2
            exit 1
          fi

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --path game --import

      - name: Smoke test macOS runtime
        run: |
          WATCH_RENDERER=opengl GDA_GODOT="$GODOT_BIN" \
            ./game/launch.sh --headless --quit-after 2

  android-platform:
    name: Android APK and gamepad checks
    needs: gut
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/godot
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          test -n "$VERSION"
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.1.13356709 cmake;3.10.2.4988404
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Godot and Android export templates
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          SDKMANAGER_ROOT="$(dirname "$(dirname "$(command -v sdkmanager)")")"
          if [[ ! -e "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]]; then
            ln -s "$SDKMANAGER_ROOT" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          mkdir -p .tools "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools
          mv ".tools/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot-templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          [[ "$ACTUAL" == "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]
          KEYSTORE="$HOME/.local/share/godot/keystores/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project and export Android APK
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path game --import
          mkdir -p game/build/android ci-artifacts/android
          "$GODOT_BIN" --headless --path game --export-debug "Android Phone and Handheld"
          APK="game/build/android/watch-yongchang.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK" \
            2>&1 | tee ci-artifacts/android/signature-check.log
          BADGING="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | tee ci-artifacts/android/apk-badging.txt
          APP_VERSION="$(sed -n 's/^APP_VERSION=//p' .env | head -n1)"
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$APP_VERSION"
          ANDROID_VERSION_CODE=$((VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH))
          grep -Fq "sdkVersion:'24'" <<< "$BADGING"
          grep -Fq "targetSdkVersion:'36'" <<< "$BADGING"
          grep -Fq "versionCode='${ANDROID_VERSION_CODE}'" <<< "$BADGING"
          grep -Fq "versionName='${APP_VERSION}'" <<< "$BADGING"
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          grep -Fxq 'lib/arm64-v8a/libgodot_android.so' <<< "$APK_ENTRIES"
          grep -Fxq 'lib/armeabi-v7a/libgodot_android.so' <<< "$APK_ENTRIES"
          unzip -t "$APK" >/dev/null
          {
            echo "package=fun.xingwangzhe.watchyongchang"
            echo "abis=arm64-v8a,armeabi-v7a"
            echo "min_sdk=24"
            echo "target_sdk=36"
            echo "version=${APP_VERSION}"
            echo "gamepad_actions=move:left_stick,dpad;attack:A;dash:B;interact:X;codex:Y;auto_attack:Back"
            echo "gamepad_tests=GUT:test_android_gamepad.gd"
            echo "signature=verified_debug_key"
            echo "ANDROID_BUILD_CHECKS_OK"
          } | tee ci-artifacts/android/build-check.log
          cp "$APK" ci-artifacts/android/watch-yongchang-android.apk

      - name: Upload Android APK and controller checks
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ci-artifacts/android
          if-no-files-found: error
          retention-days: 14

  web-engine:
    name: Web engine template
    needs: gut
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build optimized Web export template
        uses: ./.github/actions/build-web-engine
        with:
          godot-version: ${{ steps.version.outputs.value }}
          emsdk-version: "4.0.20"
          scons-version: "4.11.1"
          output-dir: ${{ runner.temp }}/web-engine-dist
          scons-cache: ${{ runner.temp }}/scons-cache
          jobs: "4"

      - name: Upload Web export template
        uses: actions/upload-artifact@v4
        with:
          name: web-export-template
          path: ${{ runner.temp }}/web-engine-dist/web_nothreads_release.zip
          if-no-files-found: error
          retention-days: 14

  web-build:
    name: Web build
    needs:
      - gut
      - web-engine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/godot
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          if [ -z "$VERSION" ]; then
            echo "game/.godot-version is empty" >&2
            exit 1
          fi
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download optimized Web template
        uses: actions/download-artifact@v4
        with:
          name: web-export-template
          path: ${{ runner.temp }}/web-export-template

      - name: Install Godot and optimized Web template
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools
          mv ".tools/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          mkdir -p "$TEMPLATE_DIR"
          cp "$RUNNER_TEMP/web-export-template/web_nothreads_release.zip" \
            "$TEMPLATE_DIR/web_nothreads_release.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_release.zip"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          echo "expected=${GODOT_VERSION} actual=${ACTUAL}"
          if [[ "$ACTUAL" != "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]; then
            echo "Godot binary does not match game/.godot-version" >&2
            exit 1
          fi

      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --path game --import

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Install build dependencies
        run: bun install --frozen-lockfile

      - name: Export Web
        run: |
          set -euo pipefail
          mkdir -p game/build/web
          "$GODOT_BIN" --headless --path game --export-release Web
          for file in index.html index.js index.wasm index.pck; do
            test -s "game/build/web/$file"
          done
          grep -q 'const GODOT_THREADS_ENABLED = false;' game/build/web/index.html
          grep -q '"ensureCrossOriginIsolationHeaders":false' game/build/web/index.html
          LIMIT=$((25 * 1024 * 1024))
          for file in index.wasm index.pck; do
            SIZE="$(stat -c '%s' "game/build/web/$file")"
            echo "$file bytes=$SIZE limit=$LIMIT"
            test "$SIZE" -lt "$LIMIT"
          done
          find game/build/web -name '*.import' -delete
          bun run tools/enhance_web_export.ts
          test -s game/build/web/social-card.png
          test -s game/build/web/icon-512.png
          grep -q 'property="og:title"' game/build/web/index.html

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: game/build/web
          if-no-files-found: error
          retention-days: 14

  web-deploy-edgeone:
    name: Web deploy · EdgeOne
    needs: web-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: web-dist

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Deploy raw Web build to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EDGEONE_API_TOKEN"
          for attempt in 1 2 3; do
            if bunx -y edgeone@1.7.7 makers deploy web-dist \
              -n shouwang \
              -t "$EDGEONE_API_TOKEN" \
              --area global \
              --skip-ai-gateway-sync \
              --json \
              2>&1 | tee "$RUNNER_TEMP/edgeone-deploy.log"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "EdgeOne deploy attempt $attempt failed; retrying in $((attempt * 15))s."
              sleep $((attempt * 15))
            fi
          done
          exit 1

  web-deploy-cloudflare:
    name: Web deploy · Cloudflare Pages
    needs: web-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: web-dist

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Deploy raw Web build to Cloudflare Pages
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          bunx -y wrangler@4.168.0 pages deploy web-dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true
