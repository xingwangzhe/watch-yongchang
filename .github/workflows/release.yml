name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Verify generated project metadata
        run: |
          bun run tools/sync_project_env.ts --check
          bun test tools/sync_project_env.test.ts
          python3 tools/test_package_release.py

      - name: Verify tag matches game version
        run: |
          set -euo pipefail
          GAME_VERSION="$(sed -n 's/^APP_VERSION=//p' .env | head -n1)"
          test -n "$GAME_VERSION"
          test "v${GAME_VERSION}" = "${GITHUB_REF_NAME}"
          echo "Release tag ${GITHUB_REF_NAME} matches game version ${GAME_VERSION}."

      - name: Asset red lines
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check_empty() {
            local label="$1"; shift
            local out
            out="$("$@" || true)"
            if [ -n "$out" ]; then
              echo "::error title=Asset red line: $label"
              echo "$out"
              fail=1
            fi
          }
          check_empty "static.png references" grep -R -n -E 'static\.png' game/scripts game/data game/scenes
          check_empty "retired unit directories" grep -R -n -E 'assets/units/(xiangyong|gongshou|longdeng|tengpai|huochong|jinshi|wokou_scout|wokou_gun|wokou_ronin|wokou_shield|wokou_chief)' game/scripts game/data game/scenes
          check_empty "legacy texture field in characters.json" grep -n '"texture"' game/data/characters.json
          check_empty "non-atlas unit directories" find game/assets/units -maxdepth 1 -mindepth 1 -type d ! -name full_sheets ! -name towers
          check_empty "legacy unit art at repo root" find assets -maxdepth 3 -type f \( -name '*.png' -o -name '预览-*.jpg' \)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Dora compatibility check
        run: python3 dora/build.py --check

  quality-guards:
    name: Formal, visual, and performance guards
    uses: ./.github/workflows/quality-guards.yml

  gut:
    name: GUT quality gate
    needs: [validate, quality-guards]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/godot
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          test -n "$VERSION"
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools
          mv ".tools/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          echo "expected=${GODOT_VERSION} actual=${ACTUAL}"
          if [[ "$ACTUAL" != "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]; then
            echo "Godot binary does not match game/.godot-version" >&2
            exit 1
          fi

      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --path game --import

      - name: Run GUT
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/gut
          "$GODOT_BIN" --headless --path game -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -gexit \
            2>&1 | tee ci-artifacts/gut/gut.log

      - name: Upload GUT log
        uses: actions/upload-artifact@v4
        with:
          name: release-gut
          path: ci-artifacts/gut/gut.log
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK and controller checks
    needs: gut
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/godot
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          test -n "$VERSION"
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.1.13356709 cmake;3.10.2.4988404
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Godot and Android export templates
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          SDKMANAGER_ROOT="$(dirname "$(dirname "$(command -v sdkmanager)")")"
          if [[ ! -e "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]]; then
            ln -s "$SDKMANAGER_ROOT" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          mkdir -p .tools "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools
          mv ".tools/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot-templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          [[ "$ACTUAL" == "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

      - name: Restore Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          SIGNING_KEYSTORE="$RUNNER_TEMP/watch-yongchang-release.keystore"
          SIGNING_PASSWORD_FILE="$RUNNER_TEMP/watch-yongchang-release-password"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$SIGNING_PASSWORD_FILE"
          chmod 600 "$SIGNING_KEYSTORE" "$SIGNING_PASSWORD_FILE"
          keytool -list -keystore "$SIGNING_KEYSTORE" \
            -storepass:file "$SIGNING_PASSWORD_FILE" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Import project and export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/watch-yongchang-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path game --import
          mkdir -p game/build/android ci-artifacts/android
          "$GODOT_BIN" --headless --path game --export-release "Android Phone and Handheld"
          APK="game/build/android/watch-yongchang.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            2>&1 | tee ci-artifacts/android/signature-check.log
          SIGNING_PASSWORD_FILE="$RUNNER_TEMP/watch-yongchang-release-password"
          EXPECTED_CERT_SHA256="$(keytool -exportcert \
            -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" \
            -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            -storepass:file "$SIGNING_PASSWORD_FILE" | sha256sum | awk '{print toupper($1)}')"
          PINNED_CERT_SHA256="$(sed -n 's/^ANDROID_SIGNING_CERT_SHA256=//p' .env | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          APK_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            ci-artifacts/android/signature-check.log | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$PINNED_CERT_SHA256"
          test -n "$APK_CERT_SHA256"
          test "$APK_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          test "$APK_CERT_SHA256" = "$PINNED_CERT_SHA256"
          BADGING="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | tee ci-artifacts/android/apk-badging.txt
          APP_VERSION="$(sed -n 's/^APP_VERSION=//p' .env | head -n1)"
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$APP_VERSION"
          ANDROID_VERSION_CODE=$((VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH))
          grep -Fq "sdkVersion:'24'" <<< "$BADGING"
          grep -Fq "targetSdkVersion:'36'" <<< "$BADGING"
          grep -Fq "versionCode='${ANDROID_VERSION_CODE}'" <<< "$BADGING"
          grep -Fq "versionName='${APP_VERSION}'" <<< "$BADGING"
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          grep -Fxq 'lib/arm64-v8a/libgodot_android.so' <<< "$APK_ENTRIES"
          grep -Fxq 'lib/armeabi-v7a/libgodot_android.so' <<< "$APK_ENTRIES"
          unzip -t "$APK" >/dev/null
          {
            echo "package=fun.xingwangzhe.watchyongchang"
            echo "abis=arm64-v8a,armeabi-v7a"
            echo "min_sdk=24"
            echo "target_sdk=36"
            echo "version=${APP_VERSION}"
            echo "gamepad_actions=move:left_stick,dpad;attack:A;dash:B;interact:X;codex:Y;auto_attack:Back"
            echo "controller_runtime_tests=GUT:test_android_gamepad.gd#joypad_axis_event_moves_the_live_player"
            echo "touch_runtime_tests=GUT:test_android_gamepad.gd#android_touch_swipe_moves_the_live_player_and_attack_button_reaches_run"
            echo "signature=verified_release_key"
            echo "signature_fingerprint_match=true"
            echo "signature_certificate_sha256=${APK_CERT_SHA256}"
            echo "ANDROID_BUILD_CHECKS_OK"
          } | tee ci-artifacts/android/build-check.log
          cp "$APK" ci-artifacts/android/watch-yongchang-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ci-artifacts/android
          if-no-files-found: error
          retention-days: 14

  web-engine:
    name: Web engine template
    needs: gut
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build optimized Web export template
        uses: ./.github/actions/build-web-engine
        with:
          godot-version: ${{ steps.version.outputs.value }}
          emsdk-version: "4.0.20"
          scons-version: "4.11.1"
          output-dir: ${{ runner.temp }}/web-engine-dist
          scons-cache: ${{ runner.temp }}/scons-cache
          jobs: "4"

      - name: Upload Web export template
        uses: actions/upload-artifact@v4
        with:
          name: release-web-template
          path: ${{ runner.temp }}/web-engine-dist/web_nothreads_release.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux export
    needs: gut
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/godot
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          test -n "$VERSION"
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools
          mv ".tools/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot-templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          TEMPLATE_ROOT="$(find "$RUNNER_TEMP/godot-templates" -mindepth 1 -maxdepth 1 -type d -name templates -print -quit)"
          test -n "$TEMPLATE_ROOT"
          mkdir -p "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          cp -a "$TEMPLATE_ROOT/." "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION/"
          test -f "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION/linux_release.x86_64"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          echo "expected=${GODOT_VERSION} actual=${ACTUAL}"
          if [[ "$ACTUAL" != "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]; then
            echo "Godot binary does not match game/.godot-version" >&2
            exit 1
          fi

      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --path game --import

      - name: Export Linux
        run: |
          set -euo pipefail
          mkdir -p game/build/linux ci-artifacts/linux
          "$GODOT_BIN" --headless --path game --export-release Linux
          cp game/build/linux/watch-yongchang.x86_64 ci-artifacts/linux/watch-yongchang-linux.x86_64
          cp game/build/linux/watch-yongchang.pck ci-artifacts/linux/watch-yongchang-linux.pck

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ci-artifacts/linux
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows export
    needs: gut
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        shell: pwsh
        run: |
          $version = (Get-Content game/.godot-version -Raw).Trim()
          if (-not $version) {
            throw "game/.godot-version is empty."
          }
          "GODOT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Godot and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path .tools | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "godot-win64.zip"
          $url = "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)/Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          curl.exe -fL --retry 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -Path $zip -DestinationPath .tools -Force
          $console = Get-ChildItem ".tools" -Filter "Godot_v*_win64_console.exe" | Select-Object -First 1
          if (-not $console) {
            throw "Godot Windows console executable was not found."
          }
          "GODOT_BIN=$($console.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $tpz = Join-Path $env:RUNNER_TEMP "godot-templates.tpz"
          $templateZip = Join-Path $env:RUNNER_TEMP "godot-templates.zip"
          $templateUrl = "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)/Godot_v$($env:GODOT_VERSION)_export_templates.tpz"
          curl.exe -fL --retry 3 -o $tpz $templateUrl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $tpz $templateZip -Force
          $extract = Join-Path $env:RUNNER_TEMP "godot-templates"
          Expand-Archive -Path $templateZip -DestinationPath $extract -Force
          $templateRoot = Join-Path $extract "templates"
          if (-not (Test-Path $templateRoot)) {
            throw "Export template root was not found."
          }
          $templateVersion = $env:GODOT_VERSION.Replace("-", ".")
          $templateDestination = Join-Path $env:APPDATA "Godot\export_templates\$templateVersion"
          New-Item -ItemType Directory -Force -Path $templateDestination | Out-Null
          Copy-Item (Join-Path $templateRoot "*") $templateDestination -Recurse -Force
          if (-not (Test-Path (Join-Path $templateDestination "windows_release_x86_64.exe"))) {
            throw "Windows export template was not installed."
          }

          $actual = (& $console.FullName --version | Out-String).Trim()
          $parts = $env:GODOT_VERSION -split "-", 2
          $expectedPrefix = "$($parts[0]).$($parts[1])."
          Write-Output "expected=$env:GODOT_VERSION actual=$actual"
          if (-not $actual.StartsWith($expectedPrefix)) {
            throw "Godot binary does not match game/.godot-version."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import project
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path game --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test Windows launcher
        shell: pwsh
        run: |
          $env:WATCH_GODOT = $env:GODOT_BIN
          $env:WATCH_RENDERER = "opengl"
          $env:WATCH_SETTINGS_PATH = Join-Path $env:RUNNER_TEMP "watch-yongchang-renderer.cfg"
          $output = cmd.exe /d /c "game\launch.bat --headless --quit-after 2" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) { exit $exitCode }
          $joined = $output -join "`n"
          if ($joined -notmatch "\[launch\] renderer=opengl") {
            throw "Windows launcher did not select OpenGL."
          }

      - name: Export Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path game/build/windows, ci-artifacts/windows | Out-Null
          & $env:GODOT_BIN --headless --path game --export-release Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item game/build/windows/watch-yongchang.exe ci-artifacts/windows/watch-yongchang-windows.exe -Force
          Copy-Item game/build/windows/watch-yongchang.pck ci-artifacts/windows/watch-yongchang-windows.pck -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ci-artifacts/windows
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS export
    needs: gut
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/Godot.app/Contents/MacOS/Godot
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          test -n "$VERSION"
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools
          chmod +x "$GODOT_BIN"
          xattr -dr com.apple.quarantine .tools/Godot.app || true
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot-templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          TEMPLATE_ROOT="$(find "$RUNNER_TEMP/godot-templates" -mindepth 1 -maxdepth 1 -type d -name templates -print -quit)"
          test -n "$TEMPLATE_ROOT"
          TEMPLATE_DEST="$HOME/Library/Application Support/Godot/export_templates/$TEMPLATE_VERSION"
          mkdir -p "$TEMPLATE_DEST"
          cp -a "$TEMPLATE_ROOT/." "$TEMPLATE_DEST/"
          test -f "$TEMPLATE_DEST/macos.zip"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          echo "expected=${GODOT_VERSION} actual=${ACTUAL}"
          if [[ "$ACTUAL" != "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]; then
            echo "Godot binary does not match game/.godot-version" >&2
            exit 1
          fi

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --path game --import

      - name: Smoke test macOS runtime
        run: |
          WATCH_RENDERER=opengl GDA_GODOT="$GODOT_BIN" \
            ./game/launch.sh --headless --quit-after 2

      - name: Export macOS
        run: |
          set -euo pipefail
          mkdir -p game/build/macos ci-artifacts/macos
          "$GODOT_BIN" --headless --path game --export-release macOS
          cp game/build/macos/watch-yongchang.zip ci-artifacts/macos/watch-yongchang.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ci-artifacts/macos
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web export
    needs:
      - gut
      - web-engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/godot
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          test -n "$VERSION"
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download optimized Web template
        uses: actions/download-artifact@v4
        with:
          name: release-web-template
          path: ${{ runner.temp }}/web-export-template

      - name: Install Godot and optimized Web template
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools
          mv ".tools/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          mkdir -p "$TEMPLATE_DIR"
          cp "$RUNNER_TEMP/web-export-template/web_nothreads_release.zip" \
            "$TEMPLATE_DIR/web_nothreads_release.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_release.zip"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          echo "expected=${GODOT_VERSION} actual=${ACTUAL}"
          if [[ "$ACTUAL" != "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]; then
            echo "Godot binary does not match game/.godot-version" >&2
            exit 1
          fi

      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --path game --import

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Install build dependencies
        run: bun install --frozen-lockfile

      - name: Export Web and run Web checks
        run: |
          set -euo pipefail
          mkdir -p game/build/web ci-artifacts/web/site
          CHECK_LOG="$RUNNER_TEMP/web-build-check.log"
          {
            "$GODOT_BIN" --headless --path game --export-release Web
            for file in index.html index.js index.wasm index.pck; do
              test -s "game/build/web/$file"
              echo "asset=$file bytes=$(stat -c '%s' "game/build/web/$file")"
            done
            grep -q 'const GODOT_THREADS_ENABLED = false;' game/build/web/index.html
            echo "threads=false"
            grep -q '"ensureCrossOriginIsolationHeaders":false' game/build/web/index.html
            echo "cross_origin_isolation_required=false"
            LIMIT=$((25 * 1024 * 1024))
            for file in index.wasm index.pck; do
              SIZE="$(stat -c '%s' "game/build/web/$file")"
              echo "$file bytes=$SIZE limit=$LIMIT"
              test "$SIZE" -lt "$LIMIT"
            done
            find game/build/web -name '*.import' -delete
            bun run tools/enhance_web_export.ts
            test -s game/build/web/social-card.png
            test -s game/build/web/icon-512.png
            grep -q 'property="og:title"' game/build/web/index.html
            echo "social_metadata=pass"
            echo "WEB_BUILD_CHECKS_OK"
          } 2>&1 | tee "$CHECK_LOG"
          cp "$CHECK_LOG" ci-artifacts/web/build-check.log
          cp -a game/build/web/. ci-artifacts/web/site/

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: ci-artifacts/web
          if-no-files-found: error
          retention-days: 14

  cloudflare-pages:
    name: Cloudflare Pages deploy
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: release-web
          path: ci-artifacts/web

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Deploy raw Web build to Cloudflare Pages
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          bunx -y wrangler@4.168.0 pages deploy ci-artifacts/web/site \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true

  edgeone-pages:
    name: EdgeOne deploy
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: release-web
          path: ci-artifacts/web

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Deploy raw Web build to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EDGEONE_API_TOKEN"
          for attempt in 1 2 3; do
            if bunx -y edgeone@1.7.7 makers deploy ci-artifacts/web/site \
              -n shouwang \
              -t "$EDGEONE_API_TOKEN" \
              --area global \
              --skip-ai-gateway-sync \
              --json \
              2>&1 | tee "$RUNNER_TEMP/edgeone-deploy.log"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "EdgeOne deploy attempt $attempt failed; retrying in $((attempt * 15))s."
              sleep $((attempt * 15))
            fi
          done
          exit 1

  publish:
    name: Audit and publish
    needs:
      - gut
      - linux
      - windows
      - macos
      - web
      - android
      - cloudflare-pages
      - edgeone-pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download GUT log
        uses: actions/download-artifact@v4
        with:
          name: release-gut
          path: ci-artifacts/gut

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: ci-artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: ci-artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: ci-artifacts/macos

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: release-web
          path: ci-artifacts/web

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: ci-artifacts/android

      - name: Package and audit release
        run: |
          set -euo pipefail
          chmod +x ci-artifacts/linux/watch-yongchang-linux.x86_64
          python3 tools/package_release.py \
            --input ci-artifacts \
            --output release-assets

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="release-assets/release-manifest.json"
          if [ ! -f "$REPORT" ]; then
            echo "Release manifest was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo ""
            echo "- Game: \`$(jq -r .game_version "$REPORT")\`"
            echo "- Commit: \`$(jq -r .commit "$REPORT")\`"
            echo "- Godot: \`$(jq -r .godot_version "$REPORT")\`"
            echo "- GUT: \`$(jq -r '.tests.tests') / $(jq -r '.tests.tests') passed, $(jq -r '.tests.asserts') asserts\`"
            echo "- Web checks: \`$(jq -r '.web_checks.passed' "$REPORT")\` ($(jq -r '.web_checks.log' "$REPORT"))"
            echo "- Android APK/gamepad checks: \`$(jq -r '.android_checks.passed' "$REPORT")\` ($(jq -r '.android_checks.log' "$REPORT"))"
            echo "- Web: $(jq -r '.web.url' "$REPORT")"
            echo ""
            echo "| Artifact | Bytes | SHA-256 |"
            echo "|---|---:|---|"
            jq -r '.artifacts[] | "| `\(.name)` | \(.size_bytes) | `\(.sha256)` |"' "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUTPUT="release-assets"
          FILES=(
            "$OUTPUT/watch-yongchang-linux.zip"
            "$OUTPUT/watch-yongchang-windows.zip"
            "$OUTPUT/watch-yongchang-macos.zip"
            "$OUTPUT/watch-yongchang-web.zip"
            "$OUTPUT/watch-yongchang-android.apk"
            "$OUTPUT/watch-yongchang-source.zip"
            "$OUTPUT/watch-yongchang-linux.x86_64"
            "$OUTPUT/watch-yongchang-linux.pck"
            "$OUTPUT/watch-yongchang-windows.exe"
            "$OUTPUT/watch-yongchang-windows.pck"
            "$OUTPUT/release-manifest.json"
            "$OUTPUT/SHA256SUMS.txt"
            "$OUTPUT/CI-BUILD-REPORT.md"
            "$OUTPUT/RELEASE-README.md"
          )
          for file in "${FILES[@]}"; do
            test -f "$file"
          done
          NOTES="$(printf '%s\n' \
            "《守望 · 永昌》${GITHUB_REF_NAME}。" \
            "" \
            "GUT 作为单次前置质量门禁；Linux、Windows、macOS、Web 与 Android 随后独立构建，保留 Windows 原生 smoke、PCK/ZIP 审计、Linux 发行版 smoke、Web 静态检查及 Android APK/手柄映射检查。" \
            "Web 版已并行部署至 EdgeOne Makers 与 Cloudflare Pages；生产入口：https://2026shouwang.needhelp.icu")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --verify-tag \
              --latest \
              --title "守望 · 永昌 ${GITHUB_REF_NAME}" \
              --notes "$NOTES" \
              --generate-notes
          fi
