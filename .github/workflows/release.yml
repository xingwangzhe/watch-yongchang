name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and audit release assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_BIN: ${{ github.workspace }}/.tools/godot
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read pinned Godot version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < game/.godot-version)"
          if [ -z "$VERSION" ]; then
            echo "game/.godot-version is empty" >&2
            exit 1
          fi
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools
          mv ".tools/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/godot-templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          mkdir -p "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          ACTUAL="$("$GODOT_BIN" --version)"
          EXPECTED_BASE="${GODOT_VERSION%-*}"
          EXPECTED_STATUS="${GODOT_VERSION#*-}"
          echo "expected=${GODOT_VERSION} actual=${ACTUAL}"
          if [[ "$ACTUAL" != "${EXPECTED_BASE}.${EXPECTED_STATUS}."* ]]; then
            echo "Godot binary does not match game/.godot-version" >&2
            exit 1
          fi

      - name: Build, test, export, and audit
        run: |
          set -euo pipefail
          python3 tools/release.py \
            --godot "$GODOT_BIN" \
            --output "$RUNNER_TEMP/release-assets"

      - name: Upload release assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/release-assets/release-manifest.json"
          if [ ! -f "$REPORT" ]; then
            echo "Release manifest was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Release assets"
            echo ""
            echo "- Commit: \`$(jq -r .commit "$REPORT")\`"
            echo "- Godot: \`$(jq -r .godot_version "$REPORT")\`"
            echo "- GUT: \`$(jq -r '.tests.passed') / $(jq -r '.tests.tests') passed, $(jq -r '.tests.asserts') asserts\`"
            echo ""
            echo "| Artifact | Bytes | SHA-256 |"
            echo "|---|---:|---|"
            jq -r '.artifacts[] | "| `\(.name)` | \(.size_bytes) | `\(.sha256)` |"' "$REPORT"
            echo ""
            echo "Dora runtime preview is a separate job in this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  dora-preview:
    name: Dora SSR 1.10.2 runtime preview
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download audited Dora source package
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Install preview runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1

      - name: Download official Dora SSR AppImage
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/dora.AppImage" \
            "https://github.com/IppClub/Dora-SSR/releases/download/v1.10.2/dora-ssr-v1.10.2-linux-x86_64.AppImage"
          echo "6726c68b3714c5ee937d0e5573f21895ef9eddd278fada65761a0e253e650725  $RUNNER_TEMP/dora.AppImage" | sha256sum --check -

      - name: Run isolated Dora preview
        run: |
          set -euo pipefail
          python3 dora/ci_preview.py \
            --appimage "$RUNNER_TEMP/dora.AppImage" \
            --project-zip "$RUNNER_TEMP/release-assets/watch-yongchang-dora.zip" \
            --work "$RUNNER_TEMP/dora-runtime" \
            --output "$RUNNER_TEMP/dora-preview"

      - name: Upload Dora preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dora-preview
          path: ${{ runner.temp }}/dora-preview
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Publish Dora preview summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/dora-preview/preview-result.json"
          if [ ! -f "$RESULT" ]; then
            echo "Dora preview did not produce a result." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Dora SSR preview"
            echo ""
            echo "- Result: \`$(jq -r .passed "$RESULT")\`"
            echo "- Frames: \`$(jq -r .frame_count "$RESULT")\`"
            echo "- Processes cleaned: \`$(jq -r .processes_cleaned "$RESULT")\`"
            echo "- Official shader header restored in CI: \`$(jq -r '.package.official_shader_header_restored // false' "$RESULT")\`"
            echo ""
            echo "This offscreen preview proves Dora/Godot startup and rendering only; it does not prove keyboard, mouse, upgrade selection, audio, saves, or full gameplay interaction."
          } >> "$GITHUB_STEP_SUMMARY"
